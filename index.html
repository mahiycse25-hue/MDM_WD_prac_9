<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-50 min-h-screen">

    <div class="max-w-2xl mx-auto mt-10 p-6">

        <!-- Heading -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-blue-700">
                Personal To-Do List
            </h1>

            <p class="text-gray-600 mt-2">
                Manage your daily academic and personal tasks
            </p>
        </div>

        <!-- Add Task Box -->
        <div class="bg-white p-5 rounded-xl shadow-md mb-6">

            <h2 class="text-xl font-semibold mb-3">
                Add New Task
            </h2>

            <div class="flex gap-2">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-blue-500"
                >

                <button
                    onclick="addTask()"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    Add Task
                </button>
            </div>

        </div>

        <!-- Task List -->
        <div class="bg-white p-5 rounded-xl shadow-md">

            <h2 class="text-xl font-semibold mb-4">
                My Tasks
            </h2>

            <ul id="taskList" class="space-y-3">

                <!-- Sample Tasks -->
                <li class="flex items-center justify-between bg-gray-100 p-4 rounded-lg">
                    <span onclick="completeTask(this)"
                          class="cursor-pointer">
                        Complete HTML Assignment
                    </span>

                    <button onclick="deleteTask(this)"
                            class="bg-red-500 text-white px-3 py-1 rounded">
                        Delete
                    </button>
                </li>

                <li class="flex items-center justify-between bg-gray-100 p-4 rounded-lg">
                    <span onclick="completeTask(this)"
                          class="cursor-pointer">
                        Study JavaScript
                    </span>

                    <button onclick="deleteTask(this)"
                            class="bg-red-500 text-white px-3 py-1 rounded">
                        Delete
                    </button>
                </li>

                <li class="flex items-center justify-between bg-gray-100 p-4 rounded-lg">
                    <span onclick="completeTask(this)"
                          class="cursor-pointer">
                        Submit Practical File
                    </span>

                    <button onclick="deleteTask(this)"
                            class="bg-red-500 text-white px-3 py-1 rounded">
                        Delete
                    </button>
                </li>

            </ul>

        </div>

    </div>


    <script>

        // Add new task
        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-100 p-4 rounded-lg";

            li.innerHTML = `
                <span onclick="completeTask(this)"
                      class="cursor-pointer">
                    ${task}
                </span>

                <button onclick="deleteTask(this)"
                        class="bg-red-500 text-white px-3 py-1 rounded">
                    Delete
                </button>
            `;

            document.getElementById("taskList").appendChild(li);

            input.value = "";
        }


        // Mark task as completed
        function completeTask(task) {

            task.classList.toggle("line-through");
            task.classList.toggle("text-gray-500");

        }


        // Delete task
        function deleteTask(button) {

            button.parentElement.remove();

        }

    </script>

</body>
</html>
